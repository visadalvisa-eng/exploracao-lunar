(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),stage=$('stage');let W=360,H=700,dpr=1,last=0,acc=0,elapsed=0,runId=0;const STEP=1/60,SPACING=24,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);const modes={default:{label:'Padrão',lives:3,gap:0.66,hazards:true,tilt:true},noTilt:{label:'Sem inclinação',lives:3,gap:0.66,hazards:true,tilt:false},infiniteMode:{label:'Infinito',lives:Infinity,gap:0.55,hazards:true,tilt:true},skillMode:{label:'Habilidade',lives:1,gap:0.34,hazards:false,tilt:true}};const biomes=[['Mar da Tranquilidade','#777e91','#080e1b'],['Crateras','#726476','#160e20'],['Polo Lunar','#a2b8c9','#101927'],['Mar de Nuvens','#667e9a','#0e2333'],['Planalto Vulcânico','#866858','#21120f'],['Mar da Serenidade','#9da5b0','#151c28'],['Mar de Tempestades','#626985','#101327'],['Terra das Sombras','#424657','#050710'],['Planalto de Gelo','#b2cadc','#142038'],['Deserto de Poeira','#988c9d','#211d2a'],['Montanhas','#6e788b','#0e1727']];let state='menu',mode='default',score=0,fuel=100,lives=3,dist=0,biome=0,shield=0,invulnerable=0,ship,ground=[],ceiling=[],stars=[],objects=[],particles=[],timers={},keys={left:false,right:false,thrust:false},tilt=0,tiltEnabled=false,tiltZero=null,tiltSamples=0,tiltLast=0,tiltStatus="aguardando",toastTimer=0,flash='';let record=0;try{record=Number(localStorage.getItem('exploracao_lunar_recorde')||0)}catch{}const objectStyles={fuel:'#69e6a4',poison:'#f27c78',shield:'#82d9ff',missile:'#ffb16d',drone:'#e8a0c2',ufo:'#d2b3ff',rock:'#a6a7b1'};

function corridor(){return clamp(H*modes[mode].gap,Math.min(155,H*.48),H-115)}function hashNoise(n){let q=Math.sin(n*127.1+78.233)*43758.5453;return q-Math.floor(q)}

const halfW=20,halfH=13;let terrainCrash=false;for(const sx of [ship.x-halfW,ship.x,ship.x+halfW]){if(ship.y-halfH<=terrainY(ceiling,sx)+2||ship.y+halfH>=terrainY(ground,sx)-2){terrainCrash=true;break}}if(terrainCrash)hit();if(state!=='playing')return;if(fuel<=0){hit();if(state==='playing'){fuel=25;notify('Reserva emergencial: +25%')}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=85*dt;if(p.life<=0)particles.splice(i,1)}syncUI()}

// A orientação é a fonte preferencial; o acelerômetro é usado apenas se ela não chegar.
let orientationSeen=0, motionFiltered=null, motionSamples=0;
function receiveOrientation(e){
 if(typeof e.gamma!=='number'||!Number.isFinite(e.gamma))return;

}
window.addEventListener('deviceorientation',receiveOrientation,{passive:true});

window.addEventListener('devicemotion',e=>{

 // Ângulo equivalente em graus, com filtro para reduzir vibração.
 const angle=Math.atan2(g.x,Math.max(2,Math.abs(g.y)))*180/Math.PI;

},{passive:true});
